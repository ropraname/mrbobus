map_server:
  ros__parameters:
    yaml_filename: /home/taras/robot/records/maps/field-20260928/field.yaml
bt_navigator:
  ros__parameters:
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /odom
    transform_tolerance: 0.3
    default_nav_to_pose_bt_xml: /home/taras/robot/mrbobus_ws/src/mrbobus_console/config/navigate.xml
    navigators:
    - navigate_to_pose
    navigate_to_pose:
      plugin: nav2_bt_navigator::NavigateToPoseNavigator
planner_server:
  ros__parameters:
    expected_planner_frequency: 1.0
    planner_plugins:
    - GridBased
    GridBased:
      plugin: nav2_navfn_planner::NavfnPlanner
      tolerance: 0.1
      use_astar: true
      allow_unknown: false
controller_server:
  ros__parameters:
    controller_frequency: 10.0
    failure_tolerance: 3.0
    enable_stamped_cmd_vel: true
    odom_topic: /odom
    progress_checker_plugins:
    - progress_checker
    goal_checker_plugins:
    - general_goal_checker
    controller_plugins:
    - FollowPath
    progress_checker:
      plugin: nav2_controller::PoseProgressChecker
      required_movement_angle: 0.15
      required_movement_radius: 0.08
      movement_time_allowance: 20.0
    general_goal_checker:
      plugin: nav2_controller::SimpleGoalChecker
      xy_goal_tolerance: 0.12
      yaw_goal_tolerance: 0.2
      stateful: true
    FollowPath:
      plugin: nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController
      desired_linear_vel: 0.30
      lookahead_dist: 0.2
      min_lookahead_dist: 0.2
      max_lookahead_dist: 0.45
      use_velocity_scaled_lookahead_dist: false
      rotate_to_heading_angular_vel: 0.75
      max_angular_accel: 3.0
      use_rotate_to_heading: true
      allow_reversing: false
      use_collision_detection: true
      max_allowed_time_to_collision_up_to_carrot: 1.5
      transform_tolerance: 0.3
      regulated_linear_scaling_min_speed: 0.10
      regulated_linear_scaling_min_radius: 0.40
      approach_velocity_scaling_dist: 0.25
      use_cost_regulated_linear_velocity_scaling: true
      cost_scaling_dist: 0.28
      cost_scaling_gain: 1.0
      inflation_cost_scaling_factor: 5.0
      min_approach_linear_velocity: 0.025
local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_link
      rolling_window: true
      width: 3
      height: 3
      resolution: 0.05
      footprint: '[[0.15351,0.1735],[0.15351,-0.1735],[-0.15351,-0.1735],[-0.15351,0.1735]]'
      footprint_padding: 0.04
      transform_tolerance: 0.3
      plugins:
      - obstacle_layer
      - inflation_layer
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        observation_sources: scan floor
        scan:
          topic: /navigation/scan
          data_type: LaserScan
          clearing: true
          marking: true
          obstacle_max_range: 3.0
          raytrace_max_range: 3.5
          expected_update_rate: 0.5
          observation_persistence: 0.0
        floor:
          topic: /navigation/floor_clear
          data_type: LaserScan
          clearing: true
          marking: false
          raytrace_max_range: 3.5
          expected_update_rate: 0.5
          observation_persistence: 0.0
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        inflation_radius: 0.3
        cost_scaling_factor: 5.0
      always_send_full_costmap: true
global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 3.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_link
      resolution: 0.05
      track_unknown_space: true
      trinary_costmap: false
      footprint: '[[0.15351,0.1735],[0.15351,-0.1735],[-0.15351,-0.1735],[-0.15351,0.1735]]'
      footprint_padding: 0.04
      transform_tolerance: 0.3
      plugins:
      - static_layer
      - obstacle_layer
      - inflation_layer
      static_layer:
        plugin: nav2_costmap_2d::StaticLayer
        map_subscribe_transient_local: true
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        inflation_radius: 0.4
        cost_scaling_factor: 5.0
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        observation_sources: scan floor
        scan:
          topic: /navigation/scan
          data_type: LaserScan
          clearing: true
          marking: true
          obstacle_max_range: 3.0
          raytrace_max_range: 3.5
          expected_update_rate: 0.5
          observation_persistence: 0.0
        floor:
          topic: /navigation/floor_clear
          data_type: LaserScan
          clearing: true
          marking: false
          raytrace_max_range: 3.5
          expected_update_rate: 0.5
          observation_persistence: 0.0
      always_send_full_costmap: true
