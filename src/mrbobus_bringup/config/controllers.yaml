controller_manager:
  ros__parameters:
    update_rate: 50
    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster
    diff_drive_controller:
      type: diff_drive_controller/DiffDriveController

diff_drive_controller:
  ros__parameters:
    left_wheel_names: [rear_left_wheel_joint, front_left_wheel_joint]
    right_wheel_names: [rear_right_wheel_joint, front_right_wheel_joint]
    wheel_separation: 0.29174
    wheel_radius: 0.045
    # Hardware must export physical-forward wheel radians (left CAN sign is -1).
    left_wheel_radius_multiplier: 1.0
    right_wheel_radius_multiplier: 1.0
    position_feedback: true
    open_loop: false
    publish_rate: 50.0
    odom_frame_id: odom
    base_frame_id: base_link
    tf_frame_prefix_enable: false
    enable_odom_tf: true
    cmd_vel_timeout: 0.3
    publish_limited_velocity: true
    velocity_rolling_window_size: 5
    pose_covariance_diagonal: [0.05, 0.05, 1000000.0, 1000000.0, 1000000.0, 0.25]
    twist_covariance_diagonal: [0.05, 0.05, 1000000.0, 1000000.0, 1000000.0, 0.25]
    # Initial commissioning values only; not measured braking limits.
    linear.x.max_velocity: 0.1
    linear.x.min_velocity: -0.1
    linear.x.max_acceleration: 0.1
    linear.x.max_deceleration: -0.2
    angular.z.max_velocity: 0.5
    angular.z.min_velocity: -0.5
    angular.z.max_acceleration: 0.5
    angular.z.max_deceleration: -1.0
